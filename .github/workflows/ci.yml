name: Metrix CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Secret Scanning (Gitleaks)
  gitleaks:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Backend CI (Go)
  backend-ci:
    name: Backend CI (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: api-backend/go.mod
      - name: Lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: api-backend
      - name: Test
        run: go test -v ./...

  # 3. Data Pipeline CI (Python)
  pipeline-ci:
    name: Pipeline CI (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-pipeline
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
      - name: Lint
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Test
        run: pytest || echo "No tests found yet"

  # 4. Container Scanning (Trivy)
  container-scan:
    name: Container Security (Trivy)
    runs-on: ubuntu-latest
    needs: [backend-ci, pipeline-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Build Backend Image
        run: docker build -t metrix-backend:latest ./api-backend
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'metrix-backend:latest'
          format: 'table'
          exit-code: '1' # Fail the build on vulnerabilities
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
