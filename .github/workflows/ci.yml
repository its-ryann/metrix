name: Metrix CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Secret Scanning (Gitleaks)
  gitleaks:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Backend CI (Go)
  backend-ci:
    name: Backend CI (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: api-backend/go.mod
      - name: Lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: api-backend
          install-mode: goinstall
      - name: Test
        run: go test -v ./...

  # 3. Data Pipeline CI (Python)
  pipeline-ci:
    name: Pipeline CI (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-pipeline
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest mypy
      - name: Lint (flake8)
        run: |
          flake8 . \
            --count \
            --max-line-length=100 \
            --show-source \
            --statistics
      - name: Type check (mypy)
        run: mypy . --ignore-missing-imports || true
      - name: Test
        run: pytest -v || true

  # 4. Frontend CI (JavaScript)
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-dashboard
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: npx -y acorn app.js 2>&1 || true

  # 5. Filesystem Scanning (Trivy)
  filesystem-scan:
    name: Filesystem Security (Trivy)
    runs-on: ubuntu-latest
    needs: [gitleaks]
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # 6. Container Scanning (Trivy)
  container-scan:
    name: Container Security (Trivy)
    runs-on: ubuntu-latest
    needs: [backend-ci, pipeline-ci, frontend-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Build Backend Image
        run: docker build -t metrix-backend:latest ./api-backend
      - name: Run Trivy Backend Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'metrix-backend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      - name: Build Frontend Image
        run: docker build -t metrix-frontend:latest ./frontend-dashboard
      - name: Run Trivy Frontend Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'metrix-frontend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      - name: Build Pipeline Image
        run: docker build -t metrix-pipeline:latest ./data-pipeline
      - name: Run Trivy Pipeline Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'metrix-pipeline:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'library'
          severity: 'CRITICAL,HIGH'
